<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>나는야 보건환경연구원</title>
<style>
:root{--teal:#12a594;--teal-d:#0b7d70;--ink:#17323a;--paper:#fffdf7;--warn:#e5484d;--sun:#ffc53d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;background:#bfe6f5;touch-action:none;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}

/* HUD */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
#hud>*{pointer-events:auto}
#quest{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;background:rgba(255,253,247,.94);
  border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,40,50,.18);font-weight:700;font-size:15px;line-height:1.35;
  display:flex;gap:10px;align-items:center}
#quest .no{flex:none;background:var(--teal);color:#fff;border-radius:10px;padding:3px 8px;font-size:12px}
#chips{position:absolute;top:calc(64px + env(safe-area-inset-top));left:10px;display:flex;gap:6px}
.chip{background:rgba(255,253,247,.9);border-radius:12px;padding:5px 9px;font-size:13px;font-weight:700;opacity:.45;filter:grayscale(1)}
.chip.on{opacity:1;filter:none;background:#e3fbf5}
#timer{position:absolute;top:calc(64px + env(safe-area-inset-top));right:10px;background:#17323a;color:#fff;border-radius:14px;
  padding:8px 10px 8px 14px;font-weight:700;font-size:14px;display:none;align-items:center;gap:10px}
#timer button{background:var(--sun);color:#3b2a00;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
#joy{position:absolute;left:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;
  background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 10px rgba(0,40,50,.3)}
#act{position:absolute;right:18px;bottom:calc(40px + env(safe-area-inset-bottom));min-width:132px;padding:18px 20px;border-radius:999px;
  background:var(--teal);color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 0 var(--teal-d),0 10px 18px rgba(0,60,60,.3);display:none}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-d)}
#wave{position:absolute;right:18px;bottom:calc(118px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;
  background:rgba(255,253,247,.95);font-size:24px;box-shadow:0 4px 12px rgba(0,40,50,.22)}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(23,50,58,.92);color:#fff;padding:12px 18px;
  border-radius:14px;font-weight:700;font-size:15px;max-width:84%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* 대화 */
#dialog{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;background:var(--paper);
  border-radius:20px;padding:16px 18px 14px;box-shadow:0 8px 26px rgba(0,40,50,.3);display:none}
#dialog .who{display:inline-block;background:var(--teal);color:#fff;border-radius:10px;padding:3px 10px;font-size:13px;font-weight:800;margin-bottom:8px}
#dialog .txt{word-break:keep-all;font-size:17px;line-height:1.5;font-weight:600;min-height:52px}
#dialog .nx{text-align:right;color:var(--teal-d);font-weight:800;font-size:14px;margin-top:6px}

/* 미니게임 */
#mini{position:absolute;inset:0;z-index:30;background:rgba(15,45,52,.72);display:none;align-items:center;justify-content:center;padding:14px}
.card{background:var(--paper);border-radius:22px;padding:20px 18px;width:100%;max-width:440px;max-height:100%;overflow:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
.card h3{margin:0 0 6px;font-size:20px}
.card p{margin:0 0 12px;font-size:15px;line-height:1.5;color:#3c5960}
.go{background:var(--teal);color:#fff;border-radius:16px;padding:15px 18px;font-weight:800;font-size:17px;width:100%;
  box-shadow:0 5px 0 var(--teal-d)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-d)}
.full{background:var(--paper);border-radius:22px;width:100%;max-width:440px;height:100%;max-height:760px;display:flex;flex-direction:column;overflow:hidden}
.full .ttl{padding:12px 16px 4px;font-weight:800;font-size:18px;text-align:center}
.full canvas{flex:1;min-height:0;width:100%;display:block}
.full .msg{padding:8px 14px;font-weight:700;font-size:14px;text-align:center;min-height:52px;line-height:1.4}
.full .btns{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;padding:0 12px calc(14px + env(safe-area-inset-bottom))}
.hold{background:#e6eef0;border-radius:14px;padding:16px 4px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #b9c9cd;touch-action:none}
.hold:active{transform:translateY(3px);box-shadow:0 1px 0 #b9c9cd}
.bottles{display:flex;justify-content:center;gap:18px;margin:14px 0}
.bottle{width:62px;height:140px;border:4px solid #7fa3ad;border-top-width:2px;border-radius:8px 8px 14px 14px;position:relative;overflow:hidden;background:#f3fafb}
.bottle.cur{border-color:var(--teal);box-shadow:0 0 0 4px rgba(18,165,148,.2)}
.bottle .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#7cc8ef,#3f9fd8)}
.bottle .line{position:absolute;left:0;right:0;bottom:80%;border-top:3px dashed var(--warn)}
.bottle .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.steps{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.step{background:#eef5f6;border-radius:14px;padding:13px 12px;font-weight:700;font-size:15px;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:#cfdde0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.step.ok{background:#dff7f1}.step.ok .n{background:var(--teal)}
.step.no{animation:shake .3s;background:#ffe5e5}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.incub{background:#dfe8ea;border-radius:16px;padding:12px;margin:12px 0;display:flex;justify-content:center;gap:10px;min-height:92px;border:4px solid #a9bcc1}
.slot{width:56px;height:64px;border-radius:10px;border:2px dashed #94aab0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#94aab0}
.slot.in{border-style:solid;border-color:var(--teal);background:#bfe6f5;color:var(--ink)}
.vials{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
.vial{width:64px;padding:14px 0;border-radius:12px;background:#bfe6f5;font-weight:800;font-size:15px;box-shadow:0 4px 0 #8cc3da}
.vial.used{visibility:hidden}
.paper{background:#fff;border:1px solid #d9e2e4;border-radius:12px;padding:14px;margin:10px 0;text-align:left;font-size:14px}
.paper .big{font-size:30px;font-weight:800;text-align:center;margin:6px 0 10px;color:var(--teal-d)}
.paper table{width:100%;border-collapse:collapse;font-size:13px}
.paper td{padding:4px 6px;border-top:1px solid #edf1f2}.paper td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#eef5f6;border-radius:14px;padding:14px 6px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #cbd9dc}
.opt.bad{background:#ffe5e5;box-shadow:none;opacity:.6}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0}
.rows{text-align:left;font-size:14px;margin:8px 0 12px}
.rows div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed #d9e2e4}
.cert{border:3px double var(--teal);border-radius:14px;padding:16px 12px;margin:10px 0 14px;background:#f4fffc}
.cert small{color:#3c5960}.cert b{display:block;font-size:24px;margin:6px 0}
.fact{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;text-align:left;margin-bottom:12px}
.opt.sel{background:#dff7f1;box-shadow:0 4px 0 #9fdccd}
.stackv{position:relative;height:230px;margin:10px auto;width:150px;background:linear-gradient(#cfeaf5,#eaf8fb);border-radius:14px;overflow:hidden}
.stackv .stk{position:absolute;left:55px;width:40px;top:0;bottom:0;background:repeating-linear-gradient(#d9dee1 0 40px,#e5484d 40px 52px)}
.stackv .plat{position:absolute;left:30px;width:90px;top:26px;height:8px;background:#5d6b71}
.stackv .me{position:absolute;left:94px;bottom:0;font-size:30px;transition:bottom .15s}
.gauge{position:relative;height:34px;background:#e6eef0;border-radius:17px;margin:14px 4px;overflow:hidden}
.gauge .band{position:absolute;left:42%;width:20%;top:0;bottom:0;background:#7fe0b0}
.gauge .needle{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#17323a;border-radius:3px}
.prog{height:12px;background:#e6eef0;border-radius:6px;overflow:hidden;margin:0 4px 8px}
.prog div{height:100%;width:0;background:var(--teal)}

/* 시작 */
#start{position:absolute;inset:0;z-index:40;background:linear-gradient(#c9eef7,#eafaf3);display:flex;align-items:center;justify-content:center;padding:20px}
#start .box{width:100%;max-width:380px;text-align:center}
#start .org{font-weight:800;color:var(--teal-d);font-size:15px;letter-spacing:.02em}
#start h1{font-size:34px;line-height:1.2;margin:8px 0 6px}
#start .sub{color:#3c5960;font-size:15px;margin-bottom:22px;line-height:1.5}
#start input{width:100%;padding:16px;border-radius:16px;border:2px solid #b7d6d2;font-size:20px;text-align:center;font-weight:700;background:#fff;outline:none}
#start input:focus{border-color:var(--teal)}
#badge{margin:16px auto 18px;width:210px;background:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(0,60,60,.16);overflow:hidden}
#badge .top{background:var(--teal);color:#fff;font-size:12px;font-weight:800;padding:7px}
#badge .face{font-size:44px;padding:10px 0 0}
#badge .nm{font-size:20px;font-weight:800;padding:4px 8px 12px;word-break:keep-all}
#err{color:var(--warn);font-weight:700;font-size:13px;min-height:18px;margin-top:6px}
.bw{display:flex;flex-direction:column;align-items:center}
.bw .cap{width:32px;height:10px;background:#3b82c4;border-radius:4px 4px 0 0;transition:transform .2s}
.bw .neck{width:26px;height:10px;border:3px solid #7fa3ad;border-top:0;border-bottom:0;background:#f3fafb}
.bw.cur .bottle{border-color:var(--teal);box-shadow:0 0 0 4px rgba(18,165,148,.2)}
.bw.cur .cap{transform:translate(22px,-9px) rotate(28deg)}
.bw.pouring .bottle::before{content:'';position:absolute;left:50%;top:0;width:8px;margin-left:-4px;height:100%;background:linear-gradient(#9bd6f5,#3f9fd8);opacity:.85}
.bottle::after{content:'';position:absolute;left:6px;top:8px;width:7px;bottom:14px;border-radius:4px;background:rgba(255,255,255,.6);z-index:3}
.bottle .fill::before{content:'';position:absolute;left:-10%;right:-10%;top:-4px;height:8px;border-radius:50%;background:#a9defa}
.bottle .lb{position:absolute;left:9px;right:5px;top:46%;height:22px;background:#fff;border:1px solid #c9d3d7;border-radius:3px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2;opacity:.92}
.bottle .mk{z-index:4}
.step .ic{flex:none;font-size:20px}
#stampBtn{position:absolute;right:18px;bottom:calc(180px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:rgba(255,253,247,.95);font-size:24px;box-shadow:0 4px 12px rgba(0,40,50,.22)}
.stamps{display:flex;justify-content:center;gap:12px;margin:14px 0}
.stamp{width:88px;height:88px;border-radius:50%;border:3px dashed #c9d3d7;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:14px;color:#b7c3c7;line-height:1.25}
.stamp.on{border:5px double #c8102e;color:#c8102e;transform:rotate(-12deg);background:rgba(200,16,46,.06)}
.stamp.new{animation:stampIn .6s}
@keyframes stampIn{0%{transform:scale(2.6) rotate(-12deg);opacity:0}60%{transform:scale(.9) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.step .dn{margin-left:auto;flex:none;color:var(--teal-d);font-size:12px;font-weight:800}
.step small{font-weight:600;color:#3c5960}
.incub2{background:linear-gradient(#f6f9fa,#dbe5e8);border:4px solid #8fa3a9;border-radius:16px;padding:10px 12px 14px;margin:12px 0;position:relative}
.incub2 .disp{background:#17323a;color:#7ff0b8;font-family:monospace;font-weight:700;font-size:15px;border-radius:8px;padding:5px 12px;display:inline-block;margin-bottom:10px}
.incub2 .shelf{display:flex;justify-content:center;gap:10px;padding:10px 0 8px;border-bottom:5px solid #a9bcc1;background:rgba(255,214,140,.22);border-radius:8px 8px 0 0}
.incub2 .hd{position:absolute;right:8px;top:44%;width:7px;height:44px;border-radius:4px;background:#8fa3a9}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="quest"><span class="no" id="qno">임무</span><span id="qtx"></span></div>
  <div id="chips"></div>
  <div id="timer"><span id="ttx"></span><button id="tskip">⏩ 빨리 감기</button></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="wave" aria-label="인사하기">👋</button>
  <button id="stampBtn" aria-label="도장판">📔</button>
  <button id="act"></button>
  <div id="toast"></div>
</div>

<div id="dialog"><span class="who" id="dwho"></span><div class="txt" id="dtxt"></div><div class="nx">다음 ▶</div></div>
<div id="mini"></div>

<div id="start">
  <div class="box">
    <div class="org" id="sorg"></div>
    <h1>나는야<br>보건환경연구원</h1>
    <div class="sub">연구원이 되어 강물을 뜨고, 실험하고, 보고해 보세요</div>
    <input id="nm" maxlength="6" placeholder="이름을 알려주세요" autocomplete="off" enterkeyhint="done">
    <div id="err"></div>
    <div id="badge"><div class="top">사 원 증</div><div class="face">🧑‍🔬</div><div class="nm" id="bnm">새내기 연구원</div></div>
    <button class="go" id="enter">출근하기</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

  DEPT_WATER: '수질연구과',          // 실제 과 이름으로 바꾸세요

};
const BAD_WORDS = ['시발','씨발','병신','좆','개새','fuck','shit'];

if(location.search.includes('bgtest')) window.requestAnimationFrame=f=>setTimeout(()=>f(performance.now()),16); // 자동 점검용

// 바닥 질감 만들기
function grainTex(base,specks,n,size=256,len=3){ const cv=document.createElement('canvas'); cv.width=cv.height=size; const g=cv.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,size,size);
  let r=12345; const rnd=()=>{ r=(r*16807)%2147483647; return r/2147483647; };

const TEX={ grass:grainTex('#84b96a',['#76ab5d','#93c97a','#6b9f54','#a2cd86','#7fb565'],9000,256,4), road:grainTex('#575f65',['#4c5459','#666e74','#5f676d','#474e53'],5000,256,2),
  slab:slabTex(), water:grainTex('#3f97cf',['#57aee0','#3587bd','#6cbbe8','#2f7eb3'],900,256,26) };
function texMat(t,rx,ry,o={}){ const c=t.clone(); c.needsUpdate=true; c.repeat.set(rx,ry); return new THREE.MeshLambertMaterial({map:c,...o}); }
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 600);

const sun = new THREE.DirectionalLight(0xfff0d2, 3.4); sun.position.set(40, 60, 30); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(innerWidth < 700 ? 1024 : 2048, innerWidth < 700 ? 1024 : 2048);

addEventListener('resize', resize); resize();

const mat = c => new THREE.MeshLambertMaterial({ color: c });

  if(dist(p,[car.position.x,car.position.z])<4.6) return {label:'차에 타기',fn:()=>board(car)};
  for(const s of SIGNS) if(dist(p,[s.x,s.z])<3.6) return {label:'팻말 읽기',fn:()=>{ s.read=true; const n=SIGNS.filter(x=>x.read).length;
    openMini(`<div class="card"><div style="font-size:54px">${s.e}</div><h3>${s.t}</h3><div class="fact">${s.d}</div><p style="font-weight:700">읽은 팻말 ${n} / ${SIGNS.length}${n===SIGNS.length?' · 모두 찾았어요! 🎉':''}</p><button class="go" id="ok">닫기</button></div>`); $('#ok').addEventListener('click',closeMini); }};
  if(dist(p,P.info)<3.6) return {label:'안내판 읽기',fn:()=>{ const f=FACTS[factI++%FACTS.length]; openMini(`<div class="card"><h3>연구원 이야기</h3><div class="fact">${f}</div><button class="go" id="ok">닫기</button></div>`); $('#ok').addEventListener('click',closeMini); }};
  return null;
}
let curAct=null; const actEl=$('#act'); actEl.addEventListener('click',()=>{ if(curAct&&!G.lock) curAct.fn(); });

/* ───────── 메인 루프 ───────── */
const lerpAng=(a,b,t)=>{ let d=(b-a)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return a+d*Math.min(1,t); };
const camPos=new THREE.Vector3(0,6,16); let last=performance.now(),time=0,bridgeHint=false;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; time+=dt;
  let f=-joy.y, r=joy.x;
  if(keys.KeyW||keys.ArrowUp) f=1; if(keys.KeyS||keys.ArrowDown) f=-1; if(keys.KeyD||keys.ArrowRight) r=1; if(keys.KeyA||keys.ArrowLeft) r=-1;
  const mx=-Math.sin(G.yaw)*f+Math.cos(G.yaw)*r, mz=-Math.cos(G.yaw)*f-Math.sin(G.yaw)*r, mag=Math.min(1,Math.hypot(mx,mz));
  const ent=G.driving?drv:player.g, rad=G.driving?1.7:0.5; let moving=false;
  if(mag>0.1&&!G.lock){ moving=true; const sp=(G.driving?14:6.2)*mag, h=Math.hypot(mx,mz), dx=mx/h*sp*dt, dz=mz/h*sp*dt;
    if(!blocked(ent.position.x+dx,ent.position.z,rad)) ent.position.x+=dx;
    if(!blocked(ent.position.x,ent.position.z+dz,rad)) ent.position.z+=dz;
    ent.rotation.y=lerpAng(ent.rotation.y,Math.atan2(mx,mz),dt*(G.driving?7:13)); }
  animPerson(player,moving&&!G.driving,dt); animPerson(npc,false,dt); animPerson(boss,false,dt);
  // 장비 줍기
  const its=(G.step===2||G.step===3)?ITEMS:(G.step===10||G.step===11)?ITEMS_A:null;
  if(its) for(const [i,it] of its.entries()){ if(it.got) continue; it.g.rotation.y+=dt*1.5; it.g.position.y=1.3+Math.sin(time*3+i)*0.15;
    if(Math.hypot(ent.position.x-it.x,ent.position.z-it.z)<3.4){ it.got=true; it.g.visible=false; if(its===ITEMS) G.score.equip+=10; else G.air.equip+=5; drawChips(); toast(it.n+' 챙김!',1200); } }
  if(G.step===2&&G.driving&&dist(car.position,P.bridge)<6&&!bridgeHint){ bridgeHint=true; toast('다리에 도착! 차에서 내려 물을 채취하세요.'); }
  // 기다리기
  if(G.step===5||G.step===13){ G.waitLeft-=dt; $('#ttx').textContent='🧪 분석 중 '+Math.max(0,Math.ceil(G.waitLeft))+'초'; if(G.waitLeft<=0){ setStep(G.step+1); toast('띵! 분석이 끝났어요. 환경동으로 가세요.'); } }
  // 길 안내
  const tg=STEPS[G.step].at(); const hideM=!tg||((G.step===1||G.step===9)&&G.driving);
  marker.visible=!hideM; arrow.visible=false;
  if(!hideM){ marker.position.set(tg[0],4.2+Math.sin(time*4)*0.35,tg[1]); marker.rotation.y=time*2;
    const dx=tg[0]-ent.position.x,dz=tg[1]-ent.position.z,d=Math.hypot(dx,dz);
    if(d>7){ arrow.visible=true; const k=G.driving?4.2:2.2; arrow.position.set(ent.position.x+dx/d*k,0.12,ent.position.z+dz/d*k); arrow.rotation.y=Math.atan2(dx,dz); } }
  if(flag.visible) flag.rotation.y=Math.sin(time*2)*0.15;
  sun.position.set(ent.position.x+38,58,ent.position.z+26); sun.target.position.set(ent.position.x,0,ent.position.z); sun.target.updateMatrixWorld();
  water.material.map.offset.y=time*0.04;
  for(const [i,s] of SMOKE.entries()){ const k=(time*0.16+i/SMOKE.length)%1; s.position.set(-47.5+k*k*9,20.6+k*15,-8+Math.sin(i*2.1)*k*2); s.scale.setScalar(0.9+k*3.2); s.material.opacity=0.55*(1-k); }
  // 행동 버튼
  const a=G.lock?null:getAction(); if((a&&a.label)!==(curAct&&curAct.label)){ actEl.style.display=a?'block':'none'; if(a) actEl.textContent=a.label; } curAct=a;
  // 카메라
  const tall=innerHeight>innerWidth, cd=(G.driving?13:8.5)*(tall?1.35:1), ch=(G.driving?6.5:4.6)*(tall?1.3:1);
  const want=new THREE.Vector3(ent.position.x+Math.sin(G.yaw)*cd,ch,ent.position.z+Math.cos(G.yaw)*cd);
  camPos.lerp(want,1-Math.exp(-9*dt)); camera.position.copy(camPos); camera.lookAt(ent.position.x,1.7,ent.position.z);
  renderer.render(scene,camera); requestAnimationFrame(frame);
}

/* ───────── 시작 화면 ───────── */
$('#sorg').textContent=CONFIG.ORG;
const nm=$('#nm'); const saved=store.get('hei_name'); if(saved){ nm.value=saved; }
const showName=()=>{ $('#bnm').textContent=(nm.value.trim()||'새내기')+' 연구원'; $('#err').textContent=''; }; nm.addEventListener('input',showName); showName();
$('#enter').addEventListener('click',()=>{ const v=nm.value.trim().slice(0,6);
  if(BAD_WORDS.some(w=>v.toLowerCase().includes(w))){ $('#err').textContent='다른 이름을 적어 주세요.'; return; }
  G.name=v||'새내기'; store.set('hei_name',v); setNameTag(G.name); nm.blur();
  $('#start').style.display='none'; $('#hud').style.display='block'; setStep(0); G.lock=false;
  say([['안내',`${G.name} 연구원, 첫 출근을 환영해요! 왼쪽 아래 조이스틱으로 걷고, 화면을 좌우로 밀면 둘러볼 수 있어요.`]]);
});
window.__G=G; window.__dbg={player,car,car2,P}; window.__t={sampleGame,bottleGame,labGame,climbGame,haulGame,gaugeGame,filterGame,closeMini};
// 실제 청사 3D 모형(hq.glb). 못 불러오면 위에서 만든 상자 건물을 그대로 써요.
const HQ_MODEL={ file:'hq.glb', width:64, x:10, z:-46.5, rotY:0 };
let DOOR_LIMIT=34;   // 차를 실험동 입구에서 이 거리 안에 세워야 시료를 접수할 수 있어요
const OLD_WALLS=['-12,12,-27,-17','20,36,-21,-11','-20,-12,-27,-19','-4,4,-17,-15.7','-19.5,-14.5,-5.5,-0.5'];
new GLTFLoader().load(HQ_MODEL.file, gltf=>{ const m=gltf.scene; const sz=new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
  m.scale.setScalar(HQ_MODEL.width/Math.max(sz.x,sz.z)); m.rotation.y=HQ_MODEL.rotY; const b=new THREE.Box3().setFromObject(m), c=b.getCenter(new THREE.Vector3());
  m.position.x+=HQ_MODEL.x-c.x; m.position.z+=HQ_MODEL.z-c.z; m.position.y-=b.min.y;
  m.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material){ o.material.metalness=0; o.material.roughness=1; } } }); scene.add(m);
  for(const o of [...OLD_HQ,...OLD_ENV]) o.visible=false;
  m.updateMatrixWorld(true);
  // 앞쪽의 작은 별동 건물은 잘라내요 (CUT 범위 안의 면을 지움)
  const CUT=[3,20.5,-29.5,-13], inCut=(x,z)=>x>CUT[0]&&x<CUT[1]&&z>CUT[2]&&z<CUT[3];
  m.traverse(o=>{ if(!o.isMesh) return; const g=o.geometry, p=g.attributes.position, idx=g.index?g.index.array:null, n=idx?idx.length:p.count, keep=[], a=new THREE.Vector3(), b=new THREE.Vector3(), c=new THREE.Vector3();
    for(let i=0;i<n;i+=3){ const i0=idx?idx[i]:i, i1=idx?idx[i+1]:i+1, i2=idx?idx[i+2]:i+2; a.fromBufferAttribute(p,i0).applyMatrix4(o.matrixWorld); b.fromBufferAttribute(p,i1).applyMatrix4(o.matrixWorld); c.fromBufferAttribute(p,i2).applyMatrix4(o.matrixWorld);
      if(inCut((a.x+b.x+c.x)/3,(a.z+b.z+c.z)/3)) continue; keep.push(i0,i1,i2); }
    g.setIndex(keep); });
  // 모형 모양대로 벽 만들기: 높이 2 이상인 부분이 있는 칸은 지나갈 수 없어요
  for(let i=WALLS.length-1;i>=0;i--) if(OLD_WALLS.includes(WALLS[i].join(','))) WALLS.splice(i,1);
  const C=2, cells=new Set(), v=new THREE.Vector3();
  m.traverse(o=>{ if(!o.isMesh) return; const p=o.geometry.attributes.position; for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld); if(v.y>2&&!inCut(v.x,v.z)) cells.add(Math.floor(v.x/C)+','+Math.floor(v.z/C)); } });
  // 모형에 맞춰 실험동 입구와 깃발, 길 위치를 옮겨요
  P.door[0]=19; P.door[1]=-26.5; flag.position.set(24,0,-25); DOOR_LIMIT=52;
  flat(6,16,0xeadfc8,19,0.025,-21).material=texMat(TEX.slab,1.5,4); flat(14,4,0xeadfc8,12,0.025,-13.5).material=texMat(TEX.slab,3.5,1);
  { const l=label('환경 실험동 입구 (시료 접수)',{bg:'rgba(18,165,148,.95)',fg:'#fff'}); l.scale.set(6.4,1.1,1); l.position.set(19,5.2,-28); scene.add(l); }
  for(const k of cells){ const [cx,cz]=k.split(',').map(Number); WALLS.push([cx*C,cx*C+C,cz*C,cz*C+C]); }
  window.__hq=m; window.__cells=cells; }, undefined, ()=>{});
// 그림자: 입체물은 그림자를 만들고, 모든 면은 그림자를 받아요
scene.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh) return; const m=Array.isArray(o.material)?o.material[0]:o.material; if(m.isMeshBasicMaterial) return;
  const t=o.geometry.type; o.castShadow=t!=='PlaneGeometry'&&t!=='CircleGeometry'&&!m.transparent; o.receiveShadow=true; });
camera.position.copy(camPos); requestAnimationFrame(frame);
</script>
